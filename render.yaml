services:
  - type: web
    name: ma-classe-pro
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn ecole_project.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        value: ""

      - key: DATABASE_URL
        fromDatabase:
          name: ma-classe-pro-db
          property: connectionString

databases:
  - name: ma-classe-pro-db
    plan: free
